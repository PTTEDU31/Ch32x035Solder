; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericCH32X035G8U6]
platform = ch32v
board = genericCH32X035G8U6
framework = noneos-sdk
; Keep the last 512 B below the 62 KB limit (0x0800F600-0x0800F7FF) for
; settings: the linker fails if code grows into them.
board_upload.maximum_size = 62976
build_flags = -Os -Wall
; The SDK debug.c has a blocking _write and reprograms SysTick in Delay_*;
; logging is done by src/log.c (DMA) instead.
board_build.use_builtin_debug_code = no
